# DATA

data:
  path: "data/adult_train.csv"
  prediction_path: "data/adult_new.csv"
  target: "income_over_50k"
  sensitive_attr: "race"
  drop_columns: ["id", "fnlwgt"]

# TRAIN/TEST SPLIT

test_set:
  size: 0.2
  random_state: 42

# CROSS-VALIDATION

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "fbeta_2"
    - "roc_auc"
    - "average_precision"
  
  selection_metric: "roc_auc" 
  n_jobs: 1 

# DIAGNOSTICS

diagnostics:
  id_column: "id"

  numeric_text_columns: []

  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]

  validity_rules:
    age: {min: 17, max: 90}
    hours_per_week: {min: 1, max: 99}
    capital_gain: {min: 0}
    capital_loss: {min: 0}

  canonical_categories:
    workclass: {}
    occupation: {}
    native_country: {}

  redundant_columns: ["education"]

# PREPROCESSING

preprocessing:
  encoder: "target"
  scaler: "standard"

  numeric_features:
    - age
    - education_num
    - capital_gain
    - capital_loss
    - hours_per_week
    - v01
    - v02
    - v03
    - v04
    - v05
    - v06
    - v07
    - v08
    - v09
    - v10
    - v11
    - v12
    - v13
    - v14
    - v15
    - v16
    - v17
    - v18

  categorical_features:
    - workclass
    - marital_status
    - occupation
    - relationship
    - native_country
    - v19
    - v20
    - v21
    - v22
    - v23
    - v24
    - v25
    - sex

  mnar_indicator_sources:
    - workclass
    - occupation

  random_state: 42

  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

feature_selection:
  enabled: false
  min_votes: 2
  random_state: 42

  search_space:
    select__min_votes:
      type: int
      low: 1
      high: 3

model: 
  # Available models:
  # "dummy", "logistic_regression", "naive_bayes", "decision_tree",
  # "random_forest", "oblique_random_forest", "adaboost",
  # "gradient_boosting", "hist_gradient_boosting", "xgboost"
  
  type: "xgboost"  
  
  params:
  
    # DECISION TREE
    #max_depth: 5
    #random_state: 42
    #min_samples_leaf: 10 #opt
    #min_samples_split: 20 #opt

    # RANDOM FOREST
    #n_estimators: 100
    #max_depth: 5
    #min_samples_split: 20
    #random_state: 42

    # LOGISTIC REGRESSION
    #max_iter: 2000
    #random_state: 42

    # DUMMY MODEL
    #strategy: "most_frequent"  # "stratified", "uniform", "constant"
    #random_state: 42

    # ADABOOST
    #n_estimators: 100
    #learning_rate: 0.1
    #max_depth: 3
    #random_state: 42

    # XGBOOST
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    random_state: 42
    n_jobs: 1

tuning:
  enabled: false
  n_trials: 10
  n_splits: 3
  random_state: 42
  search_spaces:
    logistic_regression:
      model__C:
        type: float
        low: 0.01
        high: 10.0
        log: true
    
    decision_tree:
      model__max_depth:
        type: int
        low: 1
        high: 20
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__criterion:
        type: categorical
        choices: ["gini", "entropy"]
    
    random_forest:
      model__n_estimators:
        type: int
        low: 100
        high: 400
      model__max_depth:
        type: categorical
        choices: [null, 5, 10, 15, 20]
      model__min_samples_split:
        type: int
        low: 2
        high: 20
      model__min_samples_leaf:
        type: int
        low: 1
        high: 10
      model__max_features:
        type: categorical
        choices: ["sqrt", "log2"]

    adaboost:
      model__n_estimators:
        type: int
        low: 50
        high: 300
      model__learning_rate:
        type: float
        low: 0.01
        high: 1.0
        log: true
      model__estimator__max_depth:
        type: int
        low: 1
        high: 3

    gradient_boosting:
      model__n_estimators:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_depth:
        type: int
        low: 1
        high: 6
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__subsample:
        type: float
        low: 0.5
        high: 1.0

    hist_gradient_boosting:
      model__max_iter:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_leaf_nodes:
        type: int
        low: 2
        high: 63
        log: true
      model__min_samples_leaf:
        type: int
        low: 5
        high: 200
        log: true
      model__l2_regularization:
        type: float
        low: 0.000001
        high: 10.0
        log: true

    naive_bayes:
      model__var_smoothing:
        type: float
        low: 0.000000000001
        high: 0.1
        log: true

    xgboost:
      model__n_estimators:
        type: int
        low: 50
        high: 600
        log: true

      model__learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true

      model__max_depth:
        type: int
        low: 1
        high: 8

      model__min_child_weight:
        type: float
        low: 1.0
        high: 50.0
        log: true

      model__subsample:
        type: float
        low: 0.5
        high: 1.0

      model__colsample_bytree:
        type: float
        low: 0.5
        high: 1.0

      model__reg_lambda:
        type: float
        low: 0.01
        high: 10.0
        log: true

      model__reg_alpha:
        type: float
        low: 0.001
        high: 10.0
        log: true

      model__gamma:
        type: float
        low: 0.0
        high: 5.0

output:
  results_dir: "results_adult"
  scoreboard: "results_adult/runs.csv"
  predictions_path: "results_adult/adult_predictions.csv"
  prediction_threshold: 0.5
