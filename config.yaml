# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

# DATA

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          
  # Excluded from model features: 
  # - id: identifier
  # - decile_score: COMPAS score 
  # - score_text: categorical version of the COMPAS score
  drop_columns: ["id", "decile_score", "score_text"]

# TRAIN/TEST SPLIT

test_set:
  size: 0.2
  random_state: 42

# CROSS-VALIDATION

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"   
  n_jobs: 1 

# DIAGNOSTICS

diagnostics:
  id_column: "id"

  numeric_text_columns: ["priors_count", "prior_offenses"]
  
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# PREPROCESSING

preprocessing:
  # options: "onehot" | "ordinal" | "count" | "target"
  encoder: "target"      
  # options: "none" | "standard" | "minmax" | "robust"
  scaler: "robust"      
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  random_state: 42
  imputation:
    numeric_strategy: "median"        # applies to age, juv_fel_count, juv_misd_count, juv_other_count, priors_count
    categorical_strategy: "most_frequent"    # applies to sex, age_cat, c_charge_degree

model: 
  # Available models: "decision_tree", "random_forest", "logistic_regression", "dummy"
  
  type: "decision_tree"
  
  params:
  
    # DECISION TREE
    max_depth: 5
    random_state: 42
    min_samples_leaf: 10 #opt
    min_samples_split: 20 #opt

    # RANDOM FOREST
    #n_estimators: 100
    #max_depth: 5
    #min_samples_split: 20
    #random_state: 42

    # LOGISTIC REGRESSION
    #max_iter: 1000
    #C: 1.0
    #random_state: 42

    # DUMMY MODEL
    #strategy: "most_frequent"  # "stratified", "uniform", "constant"
    #random_state: 42

output:
  results_dir: "results"   
