# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

# DATA

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          
  drop_columns: ["id", "decile_score", "score_text"]

# TRAIN/TEST SPLIT

test_set:
  size: 0.2
  random_state: 42

# CROSS-VALIDATION

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "fbeta_2"
    - "roc_auc"
    - "average_precision"
  
  selection_metric: "roc_auc" 
  n_jobs: 1 

# DIAGNOSTICS

diagnostics:
  id_column: "id"

  numeric_text_columns: ["priors_count", "prior_offenses"]
  
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# PREPROCESSING

preprocessing:
  # options: "onehot" | "ordinal" | "count" | "target"
  encoder: "target"      
  # options: "none" | "standard" | "minmax" | "robust"
  scaler: "standard" # "robust"      
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count", "juvenile_total_count","prior_juvenile_overlap"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  random_state: 42
  imputation:
    numeric_strategy: "median"        # applies to age, juv_fel_count, juv_misd_count, juv_other_count, priors_count
    categorical_strategy: "most_frequent"    # applies to sex, age_cat, c_charge_degree

model: 
  # Available models:
  # "dummy", "logistic_regression", "naive_bayes", "decision_tree",
  # "random_forest", "oblique_random_forest", "adaboost",
  # "gradient_boosting", "hist_gradient_boosting"
  
  type: "hist_gradient_boosting"  
  
  params:
  
    # DECISION TREE
    #max_depth: 5
    #random_state: 42
    #min_samples_leaf: 10 #opt
    #min_samples_split: 20 #opt

    # RANDOM FOREST
    #n_estimators: 100
    #max_depth: 5
    #min_samples_split: 20
    #random_state: 42

    # LOGISTIC REGRESSION
    #max_iter: 2000
    #random_state: 42

    # DUMMY MODEL
    #strategy: "most_frequent"  # "stratified", "uniform", "constant"
    #random_state: 42

    # ADABOOST
    #n_estimators: 100
    #learning_rate: 0.1
    #max_depth: 3
    #random_state: 42

tuning:
  enabled: true
  n_trials: 10
  n_splits: 3
  random_state: 42
  search_spaces:
    logistic_regression:
      model__C:
        type: float
        low: 0.01
        high: 10.0
        log: true
    
    decision_tree:
      model__max_depth:
        type: int
        low: 1
        high: 20
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__criterion:
        type: categorical
        choices: ["gini", "entropy"]
    
    random_forest:
      model__n_estimators:
        type: int
        low: 100
        high: 400
      model__max_depth:
        type: categorical
        choices: [null, 5, 10, 15, 20]
      model__min_samples_split:
        type: int
        low: 2
        high: 20
      model__min_samples_leaf:
        type: int
        low: 1
        high: 10
      model__max_features:
        type: categorical
        choices: ["sqrt", "log2"]

    adaboost:
      model__n_estimators:
        type: int
        low: 50
        high: 300
      model__learning_rate:
        type: float
        low: 0.01
        high: 1.0
        log: true
      model__estimator__max_depth:
        type: int
        low: 1
        high: 3

    gradient_boosting:
      model__n_estimators:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_depth:
        type: int
        low: 1
        high: 6
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__subsample:
        type: float
        low: 0.5
        high: 1.0

    hist_gradient_boosting:
      model__max_iter:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_leaf_nodes:
        type: int
        low: 2
        high: 63
        log: true
      model__min_samples_leaf:
        type: int
        low: 5
        high: 200
        log: true
      model__l2_regularization:
        type: float
        low: 0.000001
        high: 10.0
        log: true

    naive_bayes:
      model__var_smoothing:
        type: float
        low: 0.000000000001
        high: 0.1
        log: true

output:
  results_dir: "results"   
  scoreboard: "results/runs.csv"
